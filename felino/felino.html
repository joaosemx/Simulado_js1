<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo dos Felinos</title>
  <link rel="stylesheet" href="style_felino.css">
  <script src="script_felino.js" defer></script>
</head>
<body>

  <div class="container-felinos">
    <div class="coluna">
      <img src="../Imagens/gato01.gif" id="gato01" alt="Gato 1">
      <p>Clique em mim!</p>
    </div>

    <div class="coluna">
      <img src="../Imagens/gato02.gif" id="gato02" alt="Gato 2">
      <p id="textoGato02">Clique sobre mim várias vezes!<br>Carinhos: 0</p>
    </div>

    <div class="coluna">
      <img src="../Imagens/gato03.gif" id="gato03" alt="Gato 3">
      <p>Passe o cursor do mouse sobre mim!</p>
    </div>

    <div class="coluna">
      <img src="../Imagens/gato04.gif" id="gato04" alt="Gato 4">
      <p id="textoGato04">lá lá lá lá lá ...</p>
    </div>

    <div class="coluna">
      <img src="../Imagens/gato05.gif" id="gato05" alt="Gato 5">
      <button type="button" id="btnSorte">Gerar número da sorte</button>
      <input type="text" id="caixaSorte" readonly>
    </div>
  </div>

</body>
</html>
